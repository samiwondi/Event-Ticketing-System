spring:
  application:
    name: ticketing-system

  datasource:
    url: jdbc:postgresql://localhost:5433/ticketing
    username: ticketing
    password: ticketing
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      leak-detection-threshold: 20000     # 20s so batch inserts don't trip

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari.pool.ProxyLeakTask: ERROR